name: Test NКРЕКП source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and validate source
        run: python scripts/test_nerc_source.py
      - name: Save test summary
        uses: actions/upload-artifact@v4
        with:
          name: nerc-source-test
          path: outputs/source_test.json
          retention-days: 7
