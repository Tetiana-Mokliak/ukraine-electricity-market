name: Test update rules
on:
  push:
    paths:
      - 'scripts/updates.py'
      - 'scripts/corrections.py'
      - 'scripts/collect_nerc.py'
      - 'scripts/diagnose_source.py'
      - 'tests/**'
      - 'scripts/prepare_power_bi.py'
      - 'scripts/hourly_time.py'
      - 'scripts/hourly_trade_updates.py'
      - 'scripts/prepare_hourly_trade.py'
      - 'scripts/entsoe_hourly_check.py'
      - 'data/hourly_trade/rules.json'
      - 'requirements.txt'
      - '.github/workflows/test-updates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v
